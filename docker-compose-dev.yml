services:

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped

    environment:
      POSTGRES_USER: vidyut
      POSTGRES_PASSWORD: vidyut
      POSTGRES_DB: vidyut

    ports:
      - "5432:5432"

    volumes:
      - vidyut_postgres_data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vidyut"]
      interval: 5s
      timeout: 5s
      retries: 10

    networks:
      - vidyut_network


  redis:
    image: redis:7-alpine
    restart: unless-stopped

    ports:
      - "6379:6379"

    volumes:
      - vidyut_redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

    networks:
      - vidyut_network


  pgadmin:
    image: dpage/pgadmin4:latest
    restart: unless-stopped

    environment:
      PGADMIN_DEFAULT_EMAIL: santoshrajbgp11@gmail.com
      PGADMIN_DEFAULT_PASSWORD: 1234

    ports:
      - "5050:80"

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - vidyut_network


volumes:
  vidyut_postgres_data:
  vidyut_redis_data:


networks:
  vidyut_network:
    driver: bridge